services:
  - type: web
    name: sign-to-speech-frontend
    runtime: static
    buildCommand: rm -rf public && mkdir -p public/static && cp -R static/. public/static/ && cp static/index.html public/index.html && rm -f public/static/generate_assets.py
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
